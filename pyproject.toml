[project]
name = "tsbookmaker"
version = "0.1.0"
description = "Local NotebookLM-style 5-studio pipeline that turns a chapter source into Markdown manuscripts (intro / summary / assessment / quiz / 30-slide deck)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
    "streamlit>=1.32",
    "litellm>=1.50",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=2.7",
    "torch",
]
stt = [
    "faster-whisper>=1.0",
    "srt>=3.5",
    "webvtt-py>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "studio*", "exporters*"]

[tool.ruff]
line-length = 110
target-version = "py311"
