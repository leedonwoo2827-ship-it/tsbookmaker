# LiteLLM Proxy 라우팅 설정
# 기동: litellm --config litellm_config.yaml --port 4610
# 디폴트 모델: deepseek-v4 (model_list 첫 entry)

model_list:
  # ★ 디폴트 (모든 스튜디오가 이 키로 호출)
  - model_name: deepseek-v4
    litellm_params:
      model: deepseek/deepseek-v4
      api_key: os.environ/DEEPSEEK_API_KEY

  # 작업자가 UI 드롭다운에서 1클릭 전환할 보조 모델
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: null
